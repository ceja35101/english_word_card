<p>そのほか、ユーザー提供の写真、AIで生成したイラスト、数・色・曜日などを表すオリジナルの図を使用しています。写真に写るイラストの権利は原権利者に帰属します。</p>
<h2>各カードの教材画像</h2><ul id="sources"></ul>
<script src="cards.js"></script><script>for(const card of window.WORD_CARDS){const ids=card.source?.ids||(card.source?.id?[card.source.id]:[]);if(!ids.length)continue;const item=document.createElement('li');item.append(`No. ${card.id}：`);for(const id of ids){const link=document.createElement('a');link.href=`https://arasaac.org/pictograms/en/${id}`;link.textContent=`図 ${id}`;link.target='_blank';link.rel='noopener noreferrer';item.append(link,' ')}document.getElementById('sources').append(item)}</script>
